<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Computation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Lecture grade calculator</h1>
        <form action="scoreForm">
            <label for="attendance">ATTENDANCE </label>
            <input type="number" name="" id="attendance">

            <label for="quiz">SCORE QUIZ</label>
            <input type="number" name="" id="quiz">

            <label for="exam">SCORE EXAM</label>
            <input type="number" name="" id="exam">

            <button type="button" onclick="CalculateScore()">CLICK</button>
        </form>

        <div id="result"></div>
    </div>

    <script src="javscript.js"></script>
    
</body>
</html>
