<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <center><h1>Simple Calculator</h1>

    <label>Enter 1st num:</label>
    <input type="number" id="num1"><br><br>

    <label> Enter Operator :</label>
    <input type="text" id="operator" maxlength="1"><br><br>

    <label>Enter 2nd num:</label>
    <input type="number" id="num2"><br><br>

    <button onclick="calculate()">Compute</button>

    <h3>Result: <span id="result"></span></h3>

    <script src="index.js"></script></center>
</body>
</html>
